<svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Botol semprot pembersih rumah tangga Orchid Care">
  <defs>
    <linearGradient id="ch-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9D6"/><stop offset="0.55" stop-color="#FFC08C"/><stop offset="1" stop-color="#F5A867"/>
    </linearGradient>
    <linearGradient id="ch-trigger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFEFE0"/><stop offset="1" stop-color="#8FDDC4"/>
    </linearGradient>
  </defs>
  <ellipse cx="350" cy="600" rx="180" ry="34" fill="#1F2A24" opacity="0.07"/>

  <!-- nozzle -->
  <rect x="196" y="150" width="150" height="34" rx="17" fill="#1F2A24" opacity="0.85"/>
  <rect x="176" y="156" width="34" height="22" rx="8" fill="#1F2A24" opacity="0.85"/>

  <!-- trigger head -->
  <path d="M300 176 h96 a34 34 0 0 1 34 34 v70 h-190 v-46 a58 58 0 0 1 60 -58 z" fill="url(#ch-trigger)"/>
  <!-- trigger lever -->
  <path d="M240 250 l-46 40 a16 16 0 0 0 20 24 l52 -34 z" fill="#8FDDC4"/>

  <!-- bottle body -->
  <path d="M258 280 h150 a56 56 0 0 1 56 56 v154 a70 70 0 0 1 -70 70 h-122 a70 70 0 0 1 -70 -70 v-154 a56 56 0 0 1 56 -56 z" fill="url(#ch-body)"/>

  <!-- liquid level -->
  <path d="M206 430 h258 v60 a70 70 0 0 1 -70 70 h-118 a70 70 0 0 1 -70 -70 z" fill="#FF6F59" opacity="0.85"/>

  <!-- label -->
  <rect x="238" y="330" width="194" height="86" rx="20" fill="#FFFBF3"/>
  <rect x="262" y="352" width="120" height="14" rx="7" fill="#1F2A24" opacity="0.8"/>
  <rect x="262" y="378" width="146" height="11" rx="5.5" fill="#1F2A24" opacity="0.2"/>

  <!-- spray dots -->
  <g fill="#8FDDC4">
    <circle cx="150" cy="150" r="7"/><circle cx="120" cy="180" r="5"/><circle cx="140" cy="210" r="4"/><circle cx="108" cy="140" r="4"/>
  </g>
  <!-- highlight -->
  <rect x="210" y="320" width="18" height="210" rx="9" fill="#FFFFFF" opacity="0.5"/>
</svg>
