<svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Botol parfum linen dan ruangan Orchid Care dengan bunga anggrek">
  <defs>
    <linearGradient id="cp-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1E9FB"/><stop offset="0.55" stop-color="#CBB3EE"/><stop offset="1" stop-color="#B79BE4"/>
    </linearGradient>
    <linearGradient id="cp-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A73"/><stop offset="1" stop-color="#E85A45"/>
    </linearGradient>
  </defs>
  <ellipse cx="350" cy="600" rx="170" ry="32" fill="#1F2A24" opacity="0.07"/>

  <!-- atomizer bulb -->
  <circle cx="500" cy="250" r="46" fill="#FFD9B8"/>
  <circle cx="500" cy="250" r="46" fill="#1F2A24" opacity="0.04"/>
  <ellipse cx="486" cy="236" rx="14" ry="10" fill="#FFFFFF" opacity="0.6"/>
  <path d="M462 226 l-40 -26" stroke="#CBB3EE" stroke-width="10" stroke-linecap="round"/>

  <!-- cap -->
  <rect x="316" y="150" width="68" height="60" rx="16" fill="#1F2A24" opacity="0.85"/>
  <rect x="330" y="204" width="40" height="30" rx="8" fill="#FFC08C"/>

  <!-- bottle -->
  <path d="M280 232 h140 v34 a40 40 0 0 1 22 36 v170 a60 60 0 0 1 -60 60 h-86 a60 60 0 0 1 -60 -60 v-170 a40 40 0 0 1 22 -36 z" fill="url(#cp-glass)"/>
  <!-- liquid -->
  <path d="M258 420 h184 v52 a60 60 0 0 1 -60 60 h-64 a60 60 0 0 1 -60 -60 z" fill="url(#cp-liquid)"/>
  <!-- label -->
  <rect x="300" y="360" width="100" height="52" rx="14" fill="#FFFBF3"/>
  <rect x="318" y="378" width="64" height="10" rx="5" fill="#1F2A24" opacity="0.7"/>
  <rect x="318" y="394" width="44" height="8" rx="4" fill="#1F2A24" opacity="0.2"/>
  <!-- glass highlight -->
  <rect x="272" y="270" width="16" height="180" rx="8" fill="#FFFFFF" opacity="0.55"/>

  <!-- orchid bloom -->
  <g transform="translate(196 470)">
    <path d="M0 0 C-30 -34 -30 -70 0 -76 C30 -70 30 -34 0 0 Z" fill="#F1E4FA"/>
    <path d="M0 4 C-40 -6 -64 -34 -50 -58 C-30 -70 -6 -50 0 -18 Z" fill="#E3D6F5"/>
    <path d="M0 4 C40 -6 64 -34 50 -58 C30 -70 6 -50 0 -18 Z" fill="#E3D6F5"/>
    <path d="M-4 6 C-26 32 -20 60 4 58 C22 48 16 20 6 4 Z" fill="#EBDDF7"/>
    <path d="M4 6 C26 32 20 60 -4 58 C-22 48 -16 20 -6 4 Z" fill="#EBDDF7"/>
    <circle cx="0" cy="-8" r="12" fill="#FF6F59"/>
    <circle cx="0" cy="-8" r="5" fill="#FFE685"/>
  </g>

  <!-- sparkles -->
  <path d="M556 150 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill="#FF6F59"/>
  <circle cx="150" cy="300" r="8" fill="#CBB3EE"/>
</svg>
