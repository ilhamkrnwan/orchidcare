<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi mesin cuci, botol deterjen, dan handuk pastel Orchid Care">
  <defs>
    <linearGradient id="hc-machine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFF6F2"/>
    </linearGradient>
    <linearGradient id="hc-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFEFE0"/><stop offset="1" stop-color="#8FDDC4"/>
    </linearGradient>
    <radialGradient id="hc-glass" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#F0E8FB"/><stop offset="0.6" stop-color="#E3D6F5"/><stop offset="1" stop-color="#CBB3EE"/>
    </radialGradient>
    <linearGradient id="hc-bottle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A73"/><stop offset="1" stop-color="#E85A45"/>
    </linearGradient>
    <linearGradient id="hc-cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE685"/><stop offset="1" stop-color="#FFC94D"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="450" cy="770" rx="300" ry="46" fill="#1F2A24" opacity="0.08"/>

  <!-- towels stack -->
  <g>
    <rect x="150" y="640" width="230" height="52" rx="26" fill="#FFF1B0"/>
    <rect x="150" y="640" width="26" height="52" rx="13" fill="#FFE685"/>
    <rect x="165" y="592" width="230" height="52" rx="26" fill="#FFD9B8"/>
    <rect x="165" y="592" width="26" height="52" rx="13" fill="#FFC08C"/>
    <rect x="180" y="544" width="230" height="52" rx="26" fill="#BFEFE0"/>
    <rect x="180" y="544" width="26" height="52" rx="13" fill="#8FDDC4"/>
  </g>

  <!-- washing machine -->
  <g>
    <rect x="360" y="300" width="360" height="420" rx="52" fill="url(#hc-machine)" stroke="#1F2A24" stroke-opacity="0.08" stroke-width="4"/>
    <!-- control panel -->
    <rect x="392" y="332" width="296" height="66" rx="24" fill="url(#hc-panel)"/>
    <circle cx="640" cy="365" r="16" fill="#FFFBF3"/>
    <circle cx="640" cy="365" r="16" fill="#1F2A24" opacity="0.06"/>
    <rect x="412" y="356" width="120" height="18" rx="9" fill="#FFFFFF" opacity="0.65"/>
    <!-- door -->
    <circle cx="540" cy="540" r="128" fill="#EFF6F2"/>
    <circle cx="540" cy="540" r="128" fill="#1F2A24" opacity="0.05"/>
    <circle cx="540" cy="540" r="98" fill="url(#hc-glass)"/>
    <!-- swirl of water -->
    <path d="M540 470 a70 70 0 1 1 -60 34" fill="none" stroke="#8FDDC4" stroke-width="14" stroke-linecap="round"/>
    <path d="M540 502 a38 38 0 1 0 34 20" fill="none" stroke="#CBB3EE" stroke-width="12" stroke-linecap="round"/>
    <circle cx="512" cy="520" r="9" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="576" cy="560" r="6" fill="#FFFFFF" opacity="0.8"/>
    <!-- door glare -->
    <ellipse cx="500" cy="500" rx="34" ry="20" fill="#FFFFFF" opacity="0.5" transform="rotate(-32 500 500)"/>
    <!-- body glare -->
    <rect x="384" y="430" width="20" height="230" rx="10" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- detergent bottle -->
  <g transform="rotate(6 690 560)">
    <rect x="640" y="360" width="46" height="40" rx="12" fill="url(#hc-cap)"/>
    <path d="M636 398 h54 a44 44 0 0 1 44 44 v150 a44 44 0 0 1 -44 44 h-54 a44 44 0 0 1 -44 -44 v-150 a44 44 0 0 1 44 -44 z" fill="url(#hc-bottle)"/>
    <rect x="606" y="470" width="114" height="86" rx="16" fill="#FFFBF3" opacity="0.95"/>
    <rect x="620" y="486" width="70" height="12" rx="6" fill="#FF6F59"/>
    <rect x="620" y="506" width="86" height="9" rx="4.5" fill="#1F2A24" opacity="0.18"/>
    <rect x="620" y="522" width="60" height="9" rx="4.5" fill="#1F2A24" opacity="0.14"/>
    <rect x="604" y="410" width="14" height="180" rx="7" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- soap bubbles -->
  <g fill="#FFFFFF">
    <circle cx="300" cy="330" r="26" opacity="0.85"/>
    <circle cx="252" cy="400" r="16" opacity="0.7"/>
    <circle cx="748" cy="300" r="20" opacity="0.8"/>
    <circle cx="360" cy="250" r="12" opacity="0.65"/>
  </g>
  <g fill="none" stroke="#8FDDC4" stroke-width="4" opacity="0.6">
    <circle cx="300" cy="330" r="26"/><circle cx="748" cy="300" r="20"/>
  </g>
  <!-- sparkle -->
  <path d="M690 210 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8 z" fill="#FF6F59"/>
</svg>
