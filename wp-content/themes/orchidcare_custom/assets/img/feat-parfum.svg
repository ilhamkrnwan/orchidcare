  <!-- orchid -->
  <g transform="translate(196 486) scale(1.15)">
    <path d="M0 0 C-30 -34 -30 -70 0 -76 C30 -70 30 -34 0 0 Z" fill="#F1E4FA"/>
    <path d="M0 4 C-40 -6 -64 -34 -50 -58 C-30 -70 -6 -50 0 -18 Z" fill="#E3D6F5"/>
    <path d="M0 4 C40 -6 64 -34 50 -58 C30 -70 6 -50 0 -18 Z" fill="#E3D6F5"/>
    <path d="M-4 6 C-26 32 -20 60 4 58 C22 48 16 20 6 4 Z" fill="#EBDDF7"/>
    <path d="M4 6 C26 32 20 60 -4 58 C-22 48 -16 20 -6 4 Z" fill="#EBDDF7"/>
    <circle cx="0" cy="-8" r="12" fill="#FF6F59"/>
    <circle cx="0" cy="-8" r="5" fill="#FFE685"/>
  </g>

  <path d="M150 250 l7 20 20 7 -20 7 -7 20 -7 -20 -20 -7 20 -7 z" fill="#FF6F59"/>
